<div id="task-progress-container">
  <div [@enterAnimation] class="noTasks-padding container-diary" *ngIf="noTasksToday">
    <img src="assets/imgs/diary.png" class="icon-esm" />
  </div>

  <div *ngIf="!noTasksToday">
    <div id="navigation">{{ 'TASK_PROGRESS_TITLE' | translate }}</div>

    <div *ngIf="progress" id="progress">
      <div #progressActive class="progress-sub" *ngIf="!complete">
        <round-progress id="prog-lg" [current]="current" [max]="max" [responsive]="true" [color]="'#5C6AC0'"
          [background]="'rgba(92, 106, 192, 0.08)'" [animationDelay]="animationDelay" [duration]="duration"
          [stroke]="stroke"></round-progress>
      </div>
      <div #progressComplete class="progress-sub" *ngIf="complete" [@enterAnimation]>
        <div class="completed">
          <ion-icon #checkmark class="checkmark" name="checkmark"></ion-icon>
        </div>
      </div>
    </div>
    <div #counter *ngIf="!complete" [class.counter]="!complete" [class.counter-complete]="complete"
      [@translateY]="complete">
      <div class="large">{{ current }}</div>
      <div class="small">
        {{ 'TASK_PROGRESS_COMPLETED' | translate }}
      </div>
    </div>
    <div class="streak-card" *ngIf="isStreakShown && streakDays > 0" [@enterAnimation]>
      <ion-title>
        <ion-icon name="leaf-outline" class="streak-icon"></ion-icon>
        <b>{{ streakText }}</b>
        <ion-icon name="leaf-outline" class="streak-icon-flipped"></ion-icon>
      </ion-title>
      <span class="streak">{{ streakLabel }}</span>
    </div>
  </div>
</div>

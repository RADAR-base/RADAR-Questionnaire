<ion-content>
  <div class="page-header">
    <div class="header-top">
      <div class="avatar" (click)="showCredits()">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="header-actions">
        <ion-icon name="notifications-outline" class="bell-icon"></ion-icon>
      </div>
    </div>
    <h1 class="page-title">{{ title | async }}</h1>
  </div>

  <!-- Hero Card: Progress + Task Info + Start -->
  <div class="hero-card" [class.hidden]="showCalendar" [@moveProgress]="showCalendar">
    <div class="hero-card-inner">

      <!-- Progress Section -->
      <div class="hero-progress" *ngIf="tasksProgress | async">
        <task-progress [progress]="tasksProgress | async" [forceComplete]="showCompleted"
          [noTasksToday]="(tasksProgress | async)?.numberOfTasks == 0" [streakDays]="streakDays"
          [isStreakShown]="isStreakShown | async">
        </task-progress>
      </div>
      <br><br>

      <!-- Task Info Row -->
      <div class="hero-info-row" *ngIf="nextTask && (isTaskInfoShown | async)">
        <div class="hero-info-item">
          <ion-icon name="help-circle-outline" class="hero-info-icon"></ion-icon>
          <div class="hero-info-detail">
            <span class="hero-info-value">{{ nextTask.nQuestions }}</span>
            <span class="hero-info-label">Questions</span>
          </div>
        </div>
        <div class="hero-info-divider"></div>
        <div class="hero-info-item">
          <ion-icon name="time-outline" class="hero-info-icon"></ion-icon>
          <div class="hero-info-detail">
            <span class="hero-info-value">{{ nextTask.estimatedCompletionTime }}</span>
            <span class="hero-info-label">Minutes</span>
          </div>
        </div>
      </div>

      <!-- Start Button inside card -->
      <div class="hero-start" *ngIf="getIsStartButtonShown() && (sortedTasks | async)?.size">
        <button class="hero-start-btn" (click)="startQuestionnaire(null)">
          <ion-icon name="play" class="hero-start-icon"></ion-icon>
          {{ 'BTN_START' | translate }}
        </button>
      </div>

      <!-- Study Portal Button inside card -->
      <div class="hero-start" *ngIf="showCompleted && (studyPortalReturnUrl | async)">
        <button class="hero-start-btn portal-btn" (click)="openStudyPortal()">
          <ion-icon name="open-outline" class="hero-start-icon"></ion-icon>
          {{ portalReturnText | async }}
        </button>
      </div>

      <!-- Loading -->
      <div *ngIf="
          getIsLoadingSpinnerShown() ||
          (!(sortedTasks | async)?.size &&
            (tasksProgress | async)?.numberOfTasks)
        " class="hero-spinner">
        <ion-spinner name="dots"></ion-spinner>
      </div>
    </div>
  </div>

  <!-- Bottom Section -->
  <div class="bottom-section" [class.bottom-section-up]="showCalendar">
    <!-- Ticker -->
    <div class="info-card-row">
      <ticker-bar [task]="nextTask" [isNow]="taskIsNow" [timeToNextMilli]="timeToNextTask"
        [showAffirmation]="showCompleted" [showSyncNeeded]="showSyncNeeded" [showExpired]="showExpired"
        [noTasksToday]="(tasksProgress | async)?.numberOfTasks == 0"></ticker-bar>
    </div>

  </div>
</ion-content>

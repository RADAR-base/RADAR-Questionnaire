<ion-content [scrollY]="true">
  <div class="page-header">
    <div class="header-top">
      <div class="avatar">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="header-actions">
        <ion-icon name="notifications-outline" class="bell-icon"></ion-icon>
      </div>
    </div>
    <h1 class="page-title">{{ title | async }}</h1>
  </div>

  <div class="assessments-content">
    <div *ngFor="let a of assessments; let i = index">
      <div class="task-card" (click)="clicked(a)">
        <div class="task-card-icon">
          <ion-icon name="document-text-outline"></ion-icon>
        </div>
        <div class="task-card-content">
          <div class="task-card-name">{{ a.name }}</div>
          <div class="task-card-meta">
            <img class="icon-padding icon-xsm" src="assets/imgs/stopwatch.png" />
            {{ a.estimatedCompletionTime }}
            <span class="units">min</span>
          </div>
        </div>
        <ion-icon name="chevron-forward-outline" class="task-card-arrow"></ion-icon>
      </div>
    </div>

    <div *ngIf="!assessments || assessments.length === 0" class="empty-state">
      <ion-icon name="clipboard-outline" class="empty-icon"></ion-icon>
      <p class="empty-text">No on-demand tasks</p>
      <p class="empty-subtext">Check back later for available tasks</p>
    </div>
  </div>
</ion-content>
